---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json

modules:
  - type: dnf
    install:
      packages:
        - noctalia

  - type: files
    files:
      # niri config (waybar-specific)
      - source: system/etc/niri/noctalia.kdl
        destination: /etc/niri/config.kdl