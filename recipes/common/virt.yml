---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

# References:
# - https://discussion.fedoraproject.org/t/current-best-practice-for-virtual-machines-on-immutable-system-kinoite-silverblue/73423
# - https://discussion.fedoraproject.org/t/best-way-to-install-libvirt-and-virt-manager-on-silverblue/30700
# - https://docs.fedoraproject.org/en-US/quick-docs/virtualization-getting-started/

modules:
  - type: dnf
    install:
      packages:
      - virt-install
      - libvirt-daemon-config-network
      - libvirt-daemon-kvm
      - qemu-kvm
      - virt-manager
      - virt-viewer

  - type: script
    snippets:
        - "systemctl enable libvirtd"